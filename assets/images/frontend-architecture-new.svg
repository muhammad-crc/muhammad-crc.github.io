<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg6)"/>
  
  <!-- Component architecture layers -->
  <!-- Presentation Layer -->
  <rect x="50" y="50" width="300" height="40" rx="8" fill="#ff6b6b" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <text x="200" y="75" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">Presentation Layer (React/Vue)</text>
  
  <!-- State Management -->
  <rect x="70" y="110" width="260" height="35" rx="6" fill="#4ecdc4" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <text x="200" y="132" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">State Management (Redux/Vuex)</text>
  
  <!-- Business Logic -->
  <rect x="90" y="165" width="220" height="30" rx="5" fill="#45b7d1" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <text x="200" y="185" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="Arial">Business Logic Layer</text>
  
  <!-- API Layer -->
  <rect x="110" y="215" width="180" height="25" rx="4" fill="#f9ca24" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <text x="200" y="232" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial">API / Service Layer</text>
  
  <!-- Modern patterns -->
  <circle cx="350" cy="80" r="20" fill="#6c5ce7" stroke="#fff" stroke-width="2"/>
  <text x="350" y="85" text-anchor="middle" fill="white" font-size="10" font-family="Arial">µFE</text>
  
  <circle cx="350" cy="130" r="20" fill="#00d2d3" stroke="#fff" stroke-width="2"/>
  <text x="350" y="135" text-anchor="middle" fill="white" font-size="10" font-family="Arial">SSR</text>
  
  <circle cx="350" cy="180" r="20" fill="#ff9ff3" stroke="#fff" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" fill="white" font-size="10" font-family="Arial">PWA</text>
  
  <!-- Data flow arrows -->
  <path d="M 200 90 L 200 110" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8"/>
  <path d="M 200 145 L 200 165" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8"/>
  <path d="M 200 195 L 200 215" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.8"/>
  
  <!-- Component boxes -->
  <rect x="30" y="260" width="60" height="25" rx="3" fill="#fff" stroke="#666" stroke-width="1" opacity="0.9"/>
  <text x="60" y="276" text-anchor="middle" fill="#666" font-size="10" font-family="Arial">Components</text>
  
  <rect x="110" y="260" width="60" height="25" rx="3" fill="#fff" stroke="#666" stroke-width="1" opacity="0.9"/>
  <text x="140" y="276" text-anchor="middle" fill="#666" font-size="10" font-family="Arial">Hooks</text>
  
  <rect x="190" y="260" width="60" height="25" rx="3" fill="#fff" stroke="#666" stroke-width="1" opacity="0.9"/>
  <text x="220" y="276" text-anchor="middle" fill="#666" font-size="10" font-family="Arial">Services</text>
  
  <rect x="270" y="260" width="60" height="25" rx="3" fill="#fff" stroke="#666" stroke-width="1" opacity="0.9"/>
  <text x="300" y="276" text-anchor="middle" fill="#666" font-size="10" font-family="Arial">Utils</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">Frontend Architecture</text>
</svg>