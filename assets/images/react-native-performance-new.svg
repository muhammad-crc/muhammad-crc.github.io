<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21209c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f2f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg2)"/>
  
  <!-- Phone mockup -->
  <rect x="150" y="50" width="100" height="180" rx="15" ry="15" fill="url(#phoneGrad)" stroke="#333" stroke-width="2"/>
  <rect x="160" y="70" width="80" height="140" rx="5" ry="5" fill="#333"/>
  
  <!-- Screen content -->
  <rect x="165" y="75" width="70" height="8" fill="#61dafb" opacity="0.8"/>
  <rect x="165" y="88" width="50" height="6" fill="#61dafb" opacity="0.6"/>
  <rect x="165" y="98" width="60" height="6" fill="#61dafb" opacity="0.6"/>
  
  <!-- Performance indicators -->
  <circle cx="165" cy="125" r="3" fill="#00d2d3"/>
  <circle cx="175" cy="125" r="3" fill="#ff9ff3"/>
  <circle cx="185" cy="125" r="3" fill="#54a0ff"/>
  
  <!-- Performance bars -->
  <rect x="165" y="140" width="25" height="4" fill="#00d2d3"/>
  <rect x="165" y="148" width="40" height="4" fill="#ff9ff3"/>
  <rect x="165" y="156" width="15" height="4" fill="#54a0ff"/>
  
  <!-- React logo elements -->
  <circle cx="320" cy="80" r="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8"/>
  <circle cx="320" cy="80" r="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8" transform="rotate(60 320 80)"/>
  <circle cx="320" cy="80" r="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8" transform="rotate(120 320 80)"/>
  <circle cx="320" cy="80" r="5" fill="#61dafb"/>
  
  <!-- Performance chart -->
  <polyline points="50,200 80,180 110,160 140,150 170,140" fill="none" stroke="#00d2d3" stroke-width="3"/>
  <circle cx="50" cy="200" r="4" fill="#00d2d3"/>
  <circle cx="80" cy="180" r="4" fill="#00d2d3"/>
  <circle cx="110" cy="160" r="4" fill="#00d2d3"/>
  <circle cx="140" cy="150" r="4" fill="#00d2d3"/>
  <circle cx="170" cy="140" r="4" fill="#00d2d3"/>
  
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">React Native Performance</text>
  <text x="200" y="280" text-anchor="middle" fill="white" font-size="14" font-family="Arial">Optimized • Fast • Efficient</text>
</svg>