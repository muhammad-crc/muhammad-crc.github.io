<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg4)"/>
  
  <!-- AI Brain -->
  <ellipse cx="120" cy="100" rx="40" ry="35" fill="url(#brainGrad)" stroke="#ff6b6b" stroke-width="2"/>
  
  <!-- Neural network connections -->
  <circle cx="100" cy="85" r="4" fill="#ff6b6b"/>
  <circle cx="140" cy="85" r="4" fill="#ff6b6b"/>
  <circle cx="90" cy="110" r="4" fill="#ff6b6b"/>
  <circle cx="150" cy="110" r="4" fill="#ff6b6b"/>
  <circle cx="120" cy="130" r="4" fill="#ff6b6b"/>
  
  <!-- Connection lines within brain -->
  <line x1="100" y1="85" x2="140" y2="85" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="85" x2="90" y2="110" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="85" x2="150" y2="110" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <line x1="90" y1="110" x2="120" y2="130" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="110" x2="120" y2="130" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  
  <!-- API connections -->
  <rect x="220" y="60" width="60" height="25" rx="5" fill="#4ecdc4" stroke="#fff" stroke-width="2"/>
  <rect x="220" y="100" width="60" height="25" rx="5" fill="#45b7d1" stroke="#fff" stroke-width="2"/>
  <rect x="220" y="140" width="60" height="25" rx="5" fill="#f9ca24" stroke="#fff" stroke-width="2"/>
  
  <!-- Integration arrows -->
  <line x1="160" y1="85" x2="220" y2="72" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="100" x2="220" y2="112" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="115" x2="220" y2="152" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Data flow -->
  <rect x="320" y="80" width="50" height="40" rx="8" fill="#6c5ce7" stroke="#fff" stroke-width="2"/>
  <line x1="280" y1="100" x2="320" y2="100" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Service labels -->
  <text x="250" y="77" text-anchor="middle" fill="white" font-size="10" font-family="Arial">NLP</text>
  <text x="250" y="117" text-anchor="middle" fill="white" font-size="10" font-family="Arial">ML</text>
  <text x="250" y="157" text-anchor="middle" fill="white" font-size="10" font-family="Arial">CV</text>
  <text x="345" y="105" text-anchor="middle" fill="white" font-size="10" font-family="Arial">APP</text>
  
  <!-- Data points -->
  <circle cx="80" cy="200" r="3" fill="#ff6b6b"/>
  <circle cx="120" cy="190" r="3" fill="#4ecdc4"/>
  <circle cx="160" cy="210" r="3" fill="#45b7d1"/>
  <circle cx="200" cy="195" r="3" fill="#f9ca24"/>
  <circle cx="240" cy="205" r="3" fill="#6c5ce7"/>
  
  <!-- Data flow lines -->
  <path d="M 80 200 Q 120 180 160 210 Q 200 190 240 205" fill="none" stroke="#666" stroke-width="2" opacity="0.6"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" fill="#666" font-size="22" font-weight="bold" font-family="Arial">AI Integration</text>
  <text x="200" y="280" text-anchor="middle" fill="#666" font-size="14" font-family="Arial">Smart • Connected • Intelligent</text>
</svg>